name: Minify HTML

on:
  push:
    branches: [ develop, beta, production ]
    paths:
      - 'index.html'
  pull_request:
    branches: [ develop, beta, production ]
    paths:
      - 'index.html'
  workflow_dispatch:

# Explizite Permissions für den Workflow
permissions:
  contents: write
  pull-requests: write

jobs:
  minify:
    runs-on: ubuntu-latest
    
    # Verhindert parallele Ausführung des Workflows
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Minify HTML
      run: bun run build

    - name: Set commit message
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/production" ]]; then
          echo "COMMIT_MSG=chore(production): minify HTML [skip ci]" >> $GITHUB_ENV
        elif [[ "${{ github.ref }}" == "refs/heads/beta" ]]; then
          echo "COMMIT_MSG=chore(beta): minify HTML [skip ci]" >> $GITHUB_ENV
        else
          echo "COMMIT_MSG=chore(develop): minify HTML [skip ci]" >> $GITHUB_ENV
        fi

    - name: Commit minified files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add dist/
        git diff --quiet && git diff --staged --quiet || git commit -m "${{ env.COMMIT_MSG }}"

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }} 