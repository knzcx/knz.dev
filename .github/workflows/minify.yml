name: Minify HTML

on:
  push:
    branches: [ develop, beta, production ]
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    branches: [ develop, beta, production ]
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/**'
  # Ermöglicht manuelles Auslösen des Workflows
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual build and test'

# Explizite Permissions für den Workflow
permissions:
  contents: write
  pull-requests: write

jobs:
  minify:
    runs-on: alpine-latest
    
    # Verhindert parallele Ausführung des Workflows
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1  # Shallow clone für schnelleren Checkout
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: |
        bun install --frozen-lockfile --no-progress

    - name: Minify HTML
      run: bun run build

    - name: Configure Git
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

    - name: Commit and push changes
      run: |
        COMMIT_PREFIX="chore"
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          COMMIT_MSG="${COMMIT_PREFIX}: manual minify - ${{ github.event.inputs.reason }}"
        elif [[ "${{ github.ref }}" == "refs/heads/production" ]]; then
          COMMIT_MSG="${COMMIT_PREFIX}(production): minify HTML"
        elif [[ "${{ github.ref }}" == "refs/heads/beta" ]]; then
          COMMIT_MSG="${COMMIT_PREFIX}(beta): minify HTML"
        else
          COMMIT_MSG="${COMMIT_PREFIX}(develop): minify HTML"
        fi
        
        git add dist/
        if ! git diff --quiet --staged; then
          git commit -m "${COMMIT_MSG} [skip ci]"
          git push origin HEAD:${{ github.ref_name }} 